<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Void — survive the swarm</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070812; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block; touch-action: none; cursor: crosshair; background: #070812; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Neon Void: fly with WASD, aim with the mouse, hold to fire, dash with Shift, clear wave 10 to win"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
